<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3ef">
  <title>Entre | Mensagens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f3ef;
      --surface: #fffefa;
      --surface-soft: #f8f8f4;
      --ink: #20312c;
      --muted: #78827b;
      --line: #e9e9e2;
      --green: #276b53;
      --green-dark: #1e513f;
      --green-light: #e3f1e9;
      --coral: #dc765f;
      --coral-light: #fae8e1;
      --shadow: 0 24px 80px rgba(32, 49, 44, .12);
    }

    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(rgba(39, 107, 83, .09) .7px, transparent .7px);
      background-size: 15px 15px;
      font-family: "DM Sans", sans-serif;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .app {
      width: min(1320px, 100%);
      height: min(850px, calc(100vh - 48px));
      min-height: 560px;
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      overflow: hidden;
      background: var(--surface);
      border: 1px solid rgba(32, 49, 44, .08);
      border-radius: 10px;
      box-shadow: var(--shadow);
      animation: arrive .45s ease-out both;
    }
    @keyframes arrive { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .sidebar { min-width: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--surface); }
    .side-top { padding: 25px 24px 18px; }
    .brand-row, .section-row, .chat-head, .head-person, .composer, .composer-tools, .modal-head { display: flex; align-items: center; }
    .brand-row { justify-content: space-between; margin-bottom: 27px; }
    .brand { display: flex; align-items: center; gap: 10px; font: 800 21px "Manrope", sans-serif; letter-spacing: 0; }
    .brand-mark { width: 31px; height: 31px; display: grid; place-items: center; color: white; background: var(--green); border-radius: 9px 9px 9px 3px; }
    .brand-mark svg { width: 18px; height: 18px; }
    .profile-dot { width: 34px; height: 34px; display: grid; place-items: center; color: var(--green-dark); background: #dcece2; border: 2px solid white; border-radius: 50%; font-size: 12px; font-weight: 700; }
    .section-row { justify-content: space-between; margin-bottom: 15px; }
    .section-title { margin: 0; font: 800 23px "Manrope", sans-serif; letter-spacing: 0; }
    .icon-btn { width: 38px; height: 38px; display: inline-grid; flex: 0 0 auto; place-items: center; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; transition: background .16s, border-color .16s, transform .16s; }
    .icon-btn:hover { background: var(--green-light); border-color: #c5dfcf; transform: translateY(-1px); }
    .icon-btn svg { width: 18px; height: 18px; stroke: currentColor; }
    .search-wrap { position: relative; margin-bottom: 15px; }
    .search-wrap svg { position: absolute; left: 13px; top: 50%; width: 17px; height: 17px; color: #929a94; transform: translateY(-50%); pointer-events: none; }
    .search { width: 100%; height: 43px; padding: 0 14px 0 40px; border: 1px solid transparent; border-radius: 7px; outline: none; color: var(--ink); background: #f3f4f0; font-size: 13px; }
    .search:focus { border-color: #9bc5aa; background: white; box-shadow: 0 0 0 3px rgba(39,107,83,.09); }
    .filters { display: flex; gap: 7px; }
    .filter { min-height: 30px; padding: 0 12px; border: 1px solid transparent; border-radius: 5px; background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; font-weight: 600; }
    .filter.active { border-color: #d7e7dc; color: var(--green-dark); background: var(--green-light); }
    .chat-list { min-height: 0; overflow-y: auto; padding: 1px 10px 14px; scrollbar-width: thin; scrollbar-color: #d9dfda transparent; }
    .chat-row { width: 100%; min-height: 76px; display: flex; align-items: center; gap: 12px; padding: 11px 12px; border: 0; border-radius: 7px; text-align: left; background: transparent; cursor: pointer; animation: row-in .25s ease both; }
    @keyframes row-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .chat-row:hover { background: #f7f8f4; }
    .chat-row.selected { background: #edf4ef; }
    .avatar { width: 46px; height: 46px; position: relative; flex: 0 0 auto; overflow: hidden; display: grid; place-items: center; border-radius: 50%; color: #315c48; background: #dbe9dc; font-weight: 700; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar.small { width: 45px; height: 45px; }
    .online-dot { position: absolute; right: 0; bottom: 1px; width: 11px; height: 11px; border: 2px solid white; border-radius: 50%; background: #61ae79; }
    .chat-copy { min-width: 0; flex: 1; }
    .chat-topline, .chat-bottomline { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .chat-name { overflow: hidden; color: #273630; font-size: 13px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .chat-time { flex: 0 0 auto; color: #929a94; font-size: 10px; }
    .chat-preview { overflow: hidden; margin-top: 5px; color: #858e87; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .unread { min-width: 18px; height: 18px; display: inline-grid; place-items: center; padding: 0 5px; border-radius: 10px; color: white; background: var(--green); font-size: 10px; font-weight: 700; }
    .empty-list { padding: 26px 16px; color: var(--muted); text-align: center; font-size: 13px; line-height: 1.6; }
    .side-foot { margin-top: auto; padding: 13px 24px; display: flex; justify-content: space-between; border-top: 1px solid var(--line); color: #8b948e; font-size: 11px; }
    .side-foot span:last-child { display: flex; align-items: center; gap: 6px; }
    .safe-dot { width: 7px; height: 7px; border-radius: 50%; background: #62a879; }

    .conversation { min-width: 0; display: flex; flex-direction: column; position: relative; background: #fbfbf8; }
    .chat-head { min-height: 78px; justify-content: space-between; padding: 0 25px; border-bottom: 1px solid var(--line); background: var(--surface); }
    .head-person { min-width: 0; gap: 12px; }
    .head-copy { min-width: 0; }
    .head-name { overflow: hidden; font-size: 14px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .head-status { margin-top: 4px; color: var(--muted); font-size: 11px; }
    .head-actions { display: flex; gap: 8px; }
    .mobile-back { display: none; }
    .message-area { flex: 1; overflow-y: auto; padding: 27px clamp(18px, 6vw, 78px); background-color: #f8f9f5; background-image: radial-gradient(rgba(39, 107, 83, .035) .7px, transparent .7px); background-size: 17px 17px; scrollbar-width: thin; scrollbar-color: #d9dfda transparent; }
    .day-label { width: fit-content; margin: 0 auto 23px; padding: 6px 11px; border: 1px solid #e9ece6; border-radius: 5px; color: #818b83; background: rgba(255,255,252,.85); font-size: 10px; font-weight: 700; }
    .message-line { display: flex; margin: 10px 0; animation: message-in .2s ease both; }
    @keyframes message-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .message-line.mine { justify-content: flex-end; }
    .bubble { max-width: min(78%, 470px); padding: 10px 13px 7px; border: 1px solid #e8ebe5; border-radius: 3px 12px 12px 12px; color: #34413a; background: white; box-shadow: 0 2px 5px rgba(32,49,44,.025); }
    .mine .bubble { border-color: #d9e9dd; border-radius: 12px 3px 12px 12px; background: #e7f2e9; }
    .bubble-text { overflow-wrap: anywhere; font-size: 13px; line-height: 1.55; white-space: pre-wrap; }
    .bubble-meta { display: flex; justify-content: flex-end; align-items: center; gap: 5px; margin-top: 4px; color: #929b93; font-size: 9px; }
    .mine .bubble-meta { color: #5b8c6b; }
    .read-mark { font-size: 12px; font-weight: 700; }
    .welcome { height: 100%; display: grid; place-items: center; padding: 24px; text-align: center; }
    .welcome-inner { max-width: 310px; }
    .welcome-art { width: 112px; height: 112px; display: grid; place-items: center; margin: 0 auto 22px; border: 1px solid #e1e9e1; border-radius: 50%; color: var(--green); background: #eef4ec; }
    .welcome-art svg { width: 44px; height: 44px; stroke: currentColor; }
    .welcome h2 { margin: 0; font: 800 22px "Manrope", sans-serif; }
    .welcome p { margin: 9px 0 20px; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .welcome button { padding: 10px 15px; border: 0; border-radius: 6px; color: white; background: var(--green); cursor: pointer; font-size: 12px; font-weight: 700; }
    .composer-wrap { padding: 14px 22px 18px; border-top: 1px solid var(--line); background: var(--surface); }
    .composer-tools { gap: 5px; margin-bottom: 9px; }
    .tool-btn { width: 30px; height: 29px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 5px; color: #7c8780; background: transparent; cursor: pointer; }
    .tool-btn:hover { color: var(--green); background: #eff4ef; }
    .tool-btn svg { width: 17px; height: 17px; }
    .composer { gap: 10px; }
    .message-input { min-width: 0; height: 45px; flex: 1; padding: 0 15px; border: 1px solid #e6e9e3; border-radius: 7px; outline: none; color: var(--ink); background: #f8f9f6; font-size: 13px; }
    .message-input:focus { border-color: #9bc5aa; background: white; box-shadow: 0 0 0 3px rgba(39,107,83,.08); }
    .send-btn { width: 45px; height: 45px; display: grid; flex: 0 0 auto; place-items: center; border: 0; border-radius: 7px; color: white; background: var(--green); cursor: pointer; transition: background .16s, transform .16s; }
    .send-btn:hover { background: var(--green-dark); transform: translateY(-1px); }
    .send-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
    .send-btn svg { width: 19px; height: 19px; }
    .emoji-pop { position: absolute; bottom: 113px; left: 22px; z-index: 4; display: flex; gap: 3px; padding: 7px; border: 1px solid var(--line); border-radius: 7px; background: white; box-shadow: 0 8px 24px rgba(32,49,44,.13); }
    .emoji-pop button { width: 34px; height: 34px; border: 0; border-radius: 5px; background: white; cursor: pointer; font-size: 19px; }
    .emoji-pop button:hover { background: var(--green-light); }

    .modal-backdrop { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 20px; background: rgba(24, 38, 32, .38); animation: arrive .15s ease both; }
    .modal { width: min(420px, 100%); padding: 24px; border: 1px solid rgba(32,49,44,.08); border-radius: 9px; background: var(--surface); box-shadow: var(--shadow); }
    .modal-head { justify-content: space-between; margin-bottom: 6px; }
    .modal h2 { margin: 0; font: 800 19px "Manrope", sans-serif; }
    .modal-copy { margin: 0 0 21px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .field-label { display: block; margin: 14px 0 6px; color: #536158; font-size: 11px; font-weight: 700; }
    .field { width: 100%; height: 42px; padding: 0 11px; border: 1px solid var(--line); border-radius: 6px; outline: none; color: var(--ink); background: white; font-size: 13px; }
    .field:focus { border-color: #9bc5aa; box-shadow: 0 0 0 3px rgba(39,107,83,.08); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 23px; }
    .btn-secondary, .btn-primary { height: 39px; padding: 0 14px; border: 1px solid var(--line); border-radius: 6px; background: white; cursor: pointer; font-size: 12px; font-weight: 700; }
    .btn-primary { border-color: var(--green); color: white; background: var(--green); }
    .toast { position: fixed; right: 22px; bottom: 22px; z-index: 20; max-width: min(360px, calc(100vw - 32px)); padding: 12px 16px; border: 1px solid #dce9df; border-radius: 7px; color: #294a37; background: #f0f7f1; box-shadow: 0 8px 24px rgba(32,49,44,.12); font-size: 12px; animation: arrive .2s ease both; }
    [hidden] { display: none !important; }

    @media (max-width: 760px) {
      body { min-height: 100dvh; padding: 0; background: var(--surface); }
      .app { width: 100%; height: 100dvh; min-height: 0; grid-template-columns: minmax(0, 1fr); border: 0; border-radius: 0; box-shadow: none; }
      .sidebar, .conversation { grid-column: 1; grid-row: 1; }
      .sidebar.is-hidden { display: none; }
      .conversation.is-hidden { display: none; }
      .side-top { padding: 20px 18px 15px; }
      .brand-row { margin-bottom: 20px; }
      .chat-head { min-height: 68px; padding: 0 15px; }
      .mobile-back { display: inline-grid; width: 34px; height: 34px; margin-right: 1px; border: 0; background: transparent; }
      .head-actions .icon-btn { display: none; }
      .message-area { padding: 22px 15px; }
      .composer-wrap { padding: 11px 12px max(13px, env(safe-area-inset-bottom)); }
      .bubble { max-width: 86%; }
      .emoji-pop { bottom: 108px; left: 12px; }
      .side-foot { padding: 12px 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Mensageiro Entre">
    <aside class="sidebar" id="sidebar">
      <div class="side-top">
        <div class="brand-row">
          <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11.5a7.5 7.5 0 0 1-11.2 6.5L4 19l1.2-4.1A7.5 7.5 0 1 1 20 11.5Z"/><path d="M9 10.5c.7 1.5 1.7 2.5 3.5 3.2"/></svg></span>entre</div>
          <div class="profile-dot" title="Seu perfil">VC</div>
        </div>
        <div class="section-row">
          <h1 class="section-title">Conversas</h1>
          <button class="icon-btn" id="new-chat" type="button" title="Nova conversa" aria-label="Nova conversa"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
        <label class="search-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg><input class="search" id="search" type="search" placeholder="Buscar conversa" autocomplete="off" aria-label="Buscar conversa"></label>
        <div class="filters" role="group" aria-label="Filtrar conversas">
          <button class="filter active" data-filter="all" type="button">Todas</button>
          <button class="filter" data-filter="unread" type="button">Não lidas</button>
        </div>
      </div>
      <div class="chat-list" id="chat-list" aria-label="Lista de conversas"></div>
      <footer class="side-foot"><span>Seu espaço de conversa</span><span><i class="safe-dot"></i> Local</span></footer>
    </aside>

    <section class="conversation is-hidden" id="conversation" aria-label="Conversa">
      <header class="chat-head" id="chat-head">
        <div class="head-person">
          <button class="icon-btn mobile-back" id="back" type="button" title="Voltar às conversas" aria-label="Voltar às conversas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
          <div id="head-avatar"></div>
          <div class="head-copy"><div class="head-name" id="head-name"></div><div class="head-status" id="head-status"></div></div>
        </div>
        <div class="head-actions"><button class="icon-btn" id="contact-info" type="button" title="Informações do contato" aria-label="Informações do contato"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/></svg></button></div>
      </header>
      <div class="message-area" id="message-area" aria-live="polite"></div>
      <div class="emoji-pop" id="emoji-pop" hidden aria-label="Emojis"></div>
      <div class="composer-wrap">
        <div class="composer-tools">
          <button class="tool-btn" id="emoji-toggle" type="button" title="Adicionar emoji" aria-label="Adicionar emoji"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.3 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg></button>
        </div>
        <form class="composer" id="message-form">
          <input class="message-input" id="message-input" type="text" maxlength="4000" placeholder="Escreva uma mensagem..." autocomplete="off" aria-label="Escreva uma mensagem">
          <button class="send-btn" id="send" type="submit" title="Enviar mensagem" aria-label="Enviar mensagem" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button>
        </form>
      </div>
    </section>
  </main>
  <div id="modal-root"></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <script>
    const state = { chats: [], activeId: null, filter: "all", search: "" };
    const $ = (selector) => document.querySelector(selector);
    const iconInfo = "Mensagens e contatos ficam salvos somente neste computador.";

    function makeAvatar(chat, large = false) {
      const wrapper = document.createElement("div");
      wrapper.className = `avatar${large ? " large" : " small"}`;
      wrapper.setAttribute("aria-hidden", "true");
      const initials = chat.name.split(/\\s+/).slice(0, 2).map((part) => part[0] || "").join("").toUpperCase();
      wrapper.textContent = initials;
      if (chat.avatar) {
        const image = document.createElement("img");
        image.src = chat.avatar;
        image.alt = "";
        image.loading = "lazy";
        image.onerror = () => image.remove();
        wrapper.replaceChildren(image);
      }
      if (chat.online) {
        const dot = document.createElement("span");
        dot.className = "online-dot";
        wrapper.append(dot);
      }
      return wrapper;
    }

    function lastMessage(chat) {
      return chat.messages.length ? chat.messages[chat.messages.length - 1] : null;
    }

    function updateConversationPreview(chat) {
      const last = lastMessage(chat);
      return last ? `${last.sender === "me" ? "Você: " : ""}${last.text}` : "Comece uma conversa";
    }

    function renderList() {
      const list = $("#chat-list");
      list.replaceChildren();
      const termo = state.search.trim().toLocaleLowerCase("pt-BR");
      const chats = state.chats.filter((chat) => {
        const matchSearch = `${chat.name} ${chat.handle} ${updateConversationPreview(chat)}`.toLocaleLowerCase("pt-BR").includes(termo);
        return matchSearch && (state.filter === "all" || chat.unread > 0);
      });
      if (!chats.length) {
        const empty = document.createElement("div");
        empty.className = "empty-list";
        empty.textContent = state.search ? "Nenhuma conversa encontrada." : state.filter === "unread" ? "Tudo em dia por aqui." : "Nenhuma conversa ainda. Comece uma nova.";
        list.append(empty);
        return;
      }
      chats.forEach((chat, index) => {
        const row = document.createElement("button");
        row.type = "button";
        row.className = `chat-row${chat.id === state.activeId ? " selected" : ""}`;
        row.style.animationDelay = `${Math.min(index * 25, 150)}ms`;
        row.setAttribute("aria-label", `Abrir conversa com ${chat.name}`);
        row.append(makeAvatar(chat));
        const copy = document.createElement("span");
        copy.className = "chat-copy";
        const top = document.createElement("span");
        top.className = "chat-topline";
        const name = document.createElement("span");
        name.className = "chat-name";
        name.textContent = chat.name;
        const last = lastMessage(chat);
        const time = document.createElement("span");
        time.className = "chat-time";
        time.textContent = last ? last.time : "";
        top.append(name, time);
        const bottom = document.createElement("span");
        bottom.className = "chat-bottomline";
        const preview = document.createElement("span");
        preview.className = "chat-preview";
        preview.textContent = updateConversationPreview(chat);
        bottom.append(preview);
        if (chat.unread > 0) {
          const badge = document.createElement("span");
          badge.className = "unread";
          badge.textContent = String(chat.unread);
          bottom.append(badge);
        }
        copy.append(top, bottom);
        row.append(copy);
        row.addEventListener("click", () => selectChat(chat.id));
        list.append(row);
      });
    }

    function renderMessages() {
      const chat = state.chats.find((item) => item.id === state.activeId);
      const area = $("#message-area");
      const composer = $("#message-input");
      const send = $("#send");
      area.replaceChildren();
      send.disabled = !chat || !composer.value.trim();
      if (!chat) {
        $("#head-avatar").replaceChildren();
        $("#head-name").textContent = "";
        $("#head-status").textContent = "";
        const welcome = document.createElement("div");
        welcome.className = "welcome";
        welcome.innerHTML = `<div class="welcome-inner"><div class="welcome-art"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a7.5 7.5 0 0 1-11.2 6.5L4 19l1.2-4.1A7.5 7.5 0 1 1 20 11.5Z"/><path d="M9 10.5c.7 1.5 1.7 2.5 3.5 3.2"/></svg></div><h2>Conversa boa começa aqui.</h2><p>Escolha alguém da sua lista ou crie uma nova conversa para começar.</p><button type="button" id="welcome-new">Nova conversa</button></div>`;
        area.append(welcome);
        $("#welcome-new").addEventListener("click", openNewChat);
        return;
      }
      $("#head-avatar").replaceChildren(makeAvatar(chat, true));
      $("#head-name").textContent = chat.name;
      $("#head-status").textContent = chat.online ? "online agora" : chat.handle;
      const day = document.createElement("div");
      day.className = "day-label";
      day.textContent = "HOJE";
      area.append(day);
      chat.messages.forEach((message) => {
        const line = document.createElement("div");
        line.className = `message-line${message.sender === "me" ? " mine" : ""}`;
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        const text = document.createElement("div");
        text.className = "bubble-text";
        text.textContent = message.text;
        const meta = document.createElement("div");
        meta.className = "bubble-meta";
        const time = document.createElement("span");
        time.textContent = message.time;
        meta.append(time);
        if (message.sender === "me") {
          const read = document.createElement("span");
          read.className = "read-mark";
          read.setAttribute("aria-label", "Enviada");
          read.textContent = "✓✓";
          meta.append(read);
        }
        bubble.append(text, meta);
        line.append(bubble);
        area.append(line);
      });
      area.scrollTop = area.scrollHeight;
    }

    async function selectChat(id) {
      state.activeId = id;
      const chat = state.chats.find((item) => item.id === id);
      if (chat && chat.unread) {
        chat.unread = 0;
        try { await fetch("/api/read", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ chatId: id }) }); }
        catch (_) { showToast("Não foi possível atualizar a conversa."); }
      }
      $("#sidebar").classList.add("is-hidden");
      $("#conversation").classList.remove("is-hidden");
      renderList();
      renderMessages();
      $("#message-input").focus();
    }

    async function sendMessage(event) {
      event.preventDefault();
      const input = $("#message-input");
      const text = input.value.trim();
      if (!text || !state.activeId) return;
      const button = $("#send");
      button.disabled = true;
      try {
        const response = await fetch("/api/messages", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ chatId: state.activeId, text }) });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Falha ao enviar mensagem.");
        const chat = state.chats.find((item) => item.id === state.activeId);
        chat.messages.push(result);
        input.value = "";
        renderList();
        renderMessages();
        input.focus();
      } catch (error) {
        showToast(error.message || "Não foi possível enviar a mensagem.");
        button.disabled = false;
      }
    }

    function openNewChat() {
      const root = $("#modal-root");
      root.replaceChildren();
      const backdrop = document.createElement("div");
      backdrop.className = "modal-backdrop";
      backdrop.innerHTML = `<form class="modal" id="new-chat-form"><div class="modal-head"><h2>Nova conversa</h2><button class="icon-btn" id="close-modal" type="button" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><p class="modal-copy">Adicione alguém para iniciar uma conversa neste dispositivo.</p><label class="field-label" for="contact-name">Nome</label><input class="field" id="contact-name" name="name" maxlength="80" placeholder="Ex.: Ana Souza" required><label class="field-label" for="contact-handle">E-mail ou observação <span style="font-weight:400;color:#929a94">(opcional)</span></label><input class="field" id="contact-handle" name="handle" maxlength="100" placeholder="ana@email.com"><div class="modal-actions"><button class="btn-secondary" id="cancel-modal" type="button">Cancelar</button><button class="btn-primary" type="submit">Criar conversa</button></div></form>`;
      root.append(backdrop);
      const form = $("#new-chat-form");
      $("#contact-name").focus();
      $("#close-modal").addEventListener("click", () => root.replaceChildren());
      $("#cancel-modal").addEventListener("click", () => root.replaceChildren());
      backdrop.addEventListener("click", (event) => { if (event.target === backdrop) root.replaceChildren(); });
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const data = new FormData(form);
        const submit = form.querySelector("[type=submit]");
        submit.disabled = true;
        try {
          const response = await fetch("/api/chats", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: data.get("name"), handle: data.get("handle") || "Novo contato" }) });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "Não foi possível criar a conversa.");
          state.chats.unshift(result);
          root.replaceChildren();
          state.search = "";
          $("#search").value = "";
          state.filter = "all";
          document.querySelectorAll(".filter").forEach((filter) => filter.classList.toggle("active", filter.dataset.filter === "all"));
          await selectChat(result.id);
          renderList();
          showToast("Conversa criada.");
        } catch (error) {
          showToast(error.message || "Não foi possível criar a conversa.");
          submit.disabled = false;
        }
      });
    }

    let toastTimer;
    function showToast(message) {
      const toast = $("#toast");
      toast.textContent = message;
      toast.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.hidden = true; }, 2800);
    }

    async function start() {
      try {
        const response = await fetch("/api/chats");
        if (!response.ok) throw new Error("Não foi possível carregar as conversas.");
        state.chats = await response.json();
        state.activeId = state.chats.length ? state.chats[0].id : null;
        renderList();
        renderMessages();
        if (state.activeId) await selectChat(state.activeId);
      } catch (error) {
        showToast(error.message || "Servidor indisponível.");
      }
    }

    $("#new-chat").addEventListener("click", openNewChat);
    $("#message-form").addEventListener("submit", sendMessage);
    $("#message-input").addEventListener("input", () => { $("#send").disabled = !$("#message-input").value.trim() || !state.activeId; });
    $("#search").addEventListener("input", (event) => { state.search = event.target.value; renderList(); });
    document.querySelectorAll(".filter").forEach((button) => button.addEventListener("click", () => {
      state.filter = button.dataset.filter;
      document.querySelectorAll(".filter").forEach((item) => item.classList.toggle("active", item === button));
      renderList();
    }));
    $("#back").addEventListener("click", () => { $("#conversation").classList.add("is-hidden"); $("#sidebar").classList.remove("is-hidden"); });
    $("#contact-info").addEventListener("click", () => showToast(iconInfo));
    const emojiPop = $("#emoji-pop");
    ["😊", "😂", "❤️", "👍", "✨", "🙏", "🎉", "📸"].forEach((emoji) => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = emoji;
      button.setAttribute("aria-label", `Inserir ${emoji}`);
      button.addEventListener("click", () => {
        const input = $("#message-input");
        input.value += emoji;
        input.focus();
        $("#send").disabled = !input.value.trim() || !state.activeId;
        emojiPop.hidden = true;
      });
      emojiPop.append(button);
    });
    $("#emoji-toggle").addEventListener("click", () => { emojiPop.hidden = !emojiPop.hidden; });
    document.addEventListener("click", (event) => {
      if (!emojiPop.contains(event.target) && !$("#emoji-toggle").contains(event.target)) emojiPop.hidden = true;
    });
    start();
  </script>
</body>
</html>
